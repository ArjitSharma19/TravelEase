<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | TravelEase</title>
  <link rel="icon" type="image/png" href="logo_final.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css?v=1.0.3">
  <style>
    .reset-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 100px);
      padding: 20px;
    }
    .reset-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      padding: 40px;
      box-shadow: 0 24px 64px rgba(9, 31, 69, 0.16);
      transform: translateY(0);
      animation: cardFadeIn 0.5s ease-out;
    }
    @keyframes cardFadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .reset-card h2 {
      color: var(--blue-dark);
      font-size: 1.6rem;
      margin: 0 0 10px;
      font-weight: 700;
    }
    .reset-card p {
      font-size: 0.9rem;
      color: var(--muted);
      margin: 0 0 24px;
    }
    .form-success-msg {
      color: var(--green);
      font-weight: 700;
      font-size: 0.85rem;
      margin: 10px 0;
      min-height: 18px;
    }
    .form-error-msg {
      color: var(--red);
      font-weight: 700;
      font-size: 0.85rem;
      margin: 10px 0;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-container">
      <a class="brand" href="index.html" aria-label="TravelEase home">
        <span class="brand-mark">T</span>
        <span aria-hidden="true">✈️</span>
        <span>TravelEase</span>
      </a>
    </div>
  </header>

  <main class="reset-container">
    <div class="reset-card">
      <h2>Reset Your Password</h2>
      <p>Please enter your new password below to update your credentials.</p>
      
      <form id="resetPasswordForm">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <div class="password-wrapper">
            <input type="password" id="newPassword" placeholder="Enter new password" required autocomplete="new-password" style="width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 6px; font-size: 0.95rem; margin-top: 6px; outline: none;">
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>
        <div class="form-group" style="margin-top: 15px;">
          <label for="confirmPassword">Confirm Password</label>
          <div class="password-wrapper">
            <input type="password" id="confirmPassword" placeholder="Confirm new password" required autocomplete="new-password" style="width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 6px; font-size: 0.95rem; margin-top: 6px; outline: none;">
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>
        <div class="form-error-msg" id="resetError"></div>
        <div class="form-success-msg" id="resetSuccess"></div>
        <button class="primary-button modal-submit-btn" type="submit" style="width: 100%; padding: 12px; font-weight: 700; border-radius: 6px; margin-top: 20px; cursor: pointer;">Reset Password</button>
      </form>
      
      <div style="text-align: center; margin-top: 20px; font-size: 0.88rem;">
        <a href="index.html" class="link-btn">Back to Home</a>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const resetForm = document.getElementById("resetPasswordForm");
      const errorDiv = document.getElementById("resetError");
      const successDiv = document.getElementById("resetSuccess");
      const submitBtn = resetForm.querySelector("button[type='submit']");
      
      // Setup password toggles
      document.querySelectorAll('.password-toggle-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          const container = btn.closest('.password-wrapper');
          if (!container) return;
          const input = container.querySelector('input');
          if (!input) return;
          const icon = btn.querySelector('i');
          if (!icon) return;
          
          if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fa-solid fa-eye-slash';
          } else {
            input.type = 'password';
            icon.className = 'fa-solid fa-eye';
          }
        });
      });
      
      // Extract token from URL search params
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get("token");
      
      if (!token) {
        errorDiv.textContent = "token expired — request a new link";
        submitBtn.disabled = true;
        return;
      }
      
      resetForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        
        errorDiv.textContent = "";
        successDiv.textContent = "";
        
        if (newPassword !== confirmPassword) {
          errorDiv.textContent = "passwords don't match";
          return;
        }
        
        submitBtn.disabled = true;
        submitBtn.textContent = "Resetting...";
        
        try {
          const response = await fetch("https://travelease-xva8.onrender.com/api/auth/reset-password", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ token, password: newPassword })
          });
          
          const data = await response.json();
          
          if (!response.ok) {
            throw new Error(data.error || "Password reset failed.");
          }
          
          successDiv.textContent = data.message || "password reset successfully — redirecting to login";
          
          // Clear form inputs
          resetForm.reset();
          
          // Redirect to home page (where login modal can be opened or is open) after 2 seconds
          setTimeout(() => {
            window.location.href = "index.html?login=true&reset=success";
          }, 2000);
          
        } catch (error) {
          errorDiv.textContent = error.message;
          submitBtn.disabled = false;
          submitBtn.textContent = "Reset Password";
        }
      });
    });
  </script>
</body>
</html>
